<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="sectionHeader(subTitle,title,description,actionLabel,actionHref)"
         class="flex flex-col gap-6 md:flex-row md:items-end md:justify-between">

    <header class="max-w-3xl">

        <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-400"
           th:text="${subTitle}">
            Subtitle
        </p>

        <h2 class="mt-3 text-4xl font-bold tracking-tight text-white"
            th:text="${title}">
            Title
        </h2>

        <p class="mt-4 text-lg leading-8 text-slate-400"
           th:text="${description}">
            Description
        </p>

    </header>

    <section th:if="${actionLabel != null and !#strings.isEmpty(actionLabel)}">

        <th:block
                th:replace="~{fragments/buttons ::
                secondaryLink(${actionLabel}, ${actionHref})}">
        </th:block>

    </section>

</section>

</body>
</html>
