<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="emptyState(
            title,
            message,
            actionLabel,
            actionUrl
         )"
         class="rounded-3xl border border-dashed border-slate-300
                bg-white px-6 py-14 text-center shadow-sm">

    <div class="mx-auto flex h-16 w-16 items-center justify-center
                rounded-2xl bg-emerald-100 text-emerald-700">

        <svg xmlns="http://www.w3.org/2000/svg"
             fill="none"
             viewBox="0 0 24 24"
             stroke-width="1.8"
             stroke="currentColor"
             class="h-8 w-8">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M2.25 12 12 3l9.75 9M4.5 9.75V21h15V9.75"/>
        </svg>

    </div>

    <h3 class="mt-5 text-xl font-bold text-slate-950"
        th:text="${title}">
        No properties posted yet
    </h3>

    <p class="mx-auto mt-2 max-w-md text-sm leading-6 text-slate-500"
       th:text="${message}">
        Start by submitting your first property for admin approval.
    </p>

    <div class="mt-6">
        <th:block th:replace="~{fragments/buttons ::
            primaryLink(${actionLabel}, ${actionUrl})}">
        </th:block>
    </div>

</section>

</body>
</html>
