<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="adminSidebar(activeMenu)"
       class="fixed top-[73px] left-0 bottom-0 hidden lg:flex w-64 flex-col
              bg-slate-950 border-r border-white/10 text-slate-300">

    <section class="flex-1 px-4 py-6">

        <div class="mb-6 px-3">
            <p class="text-xs font-semibold uppercase tracking-[0.2em]
                  text-slate-500">
                Admin Portal
            </p>
        </div>

            <nav class="mt-7 space-y-2">

                <!-- Dashboard -->
                <a th:href="@{/admin/dashboard}"
                   class="flex items-center gap-3 rounded-xl px-4 py-3
                    text-sm font-medium transition"
                   th:classappend="${activeMenu == 'dashboard'}
                       ? ' bg-emerald-500 text-slate-950'
                       : ' hover:bg-white/10 hover:text-white'">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M3.75 3.75h6.5v6.5h-6.5v-6.5Zm10 0h6.5v6.5h-6.5v-6.5Zm-10 10h6.5v6.5h-6.5v-6.5Zm10 0h6.5v6.5h-6.5v-6.5Z"/>
                    </svg>

                    Dashboard
                </a>

                <!-- Pending Approvals -->
                <a th:href="@{/admin/properties/pending}"
                   class="relative flex items-center gap-3 rounded-xl px-4 py-3 pr-12
                    text-sm font-medium transition"
                   th:classappend="${activeMenu == 'pending-properties'}
                    ? ' bg-emerald-500 text-slate-950'
                    : ' hover:bg-white/10 hover:text-white'">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="h-5 w-5 shrink-0">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M12 6v6l4 2m5-2a9 9 0 1 1-18 0
                                9 9 0 0 1 18 0Z"/>
                    </svg>

                    <span class="whitespace-nowrap">
                        Pending Approvals
                    </span>

                    <span th:if="${pendingPropertyCount != null
                            and pendingPropertyCount > 0}"
                          th:text="${pendingPropertyCount}"
                          class="absolute right-4 rounded-full bg-amber-400
                        px-2.5 py-1 text-xs font-bold text-slate-950">
                        6
                    </span>
                </a>


                <!-- All Properties -->
                <a th:href="@{/admin/properties}"
                   class="flex items-center gap-3 rounded-xl px-4 py-3
                        text-sm font-medium transition"
                   th:classappend="${activeMenu == 'properties'}
                       ? ' bg-emerald-500 text-slate-950'
                       : ' hover:bg-white/10 hover:text-white'">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M3.75 21V9.75L12 3l8.25 6.75V21
                                 M9 21v-6h6v6M7.5 11.25h.008v.008H7.5v-.008Zm9 0h.008v.008H16.5v-.008Z"/>
                    </svg>

                    All Properties
                </a>

                <!-- Customers -->
                <a th:href="@{/admin/customers}"
                   class="flex items-center gap-3 rounded-xl px-4 py-3
                            text-sm font-medium transition"
                   th:classappend="${activeMenu == 'customers'}
                       ? ' bg-emerald-500 text-slate-950'
                       : ' hover:bg-white/10 hover:text-white'">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M15 19.128a9.38 9.38 0 0 0 2.625.372
                                 9.337 9.337 0 0 0 4.121-.952
                                 4.125 4.125 0 0 0-7.533-2.493
                                 M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07
                                 M15 19.128v.106A12.318 12.318 0 0 1
                                 8.624 21c-2.331 0-4.512-.645-6.374-1.766
                                 l-.001-.109a6.375 6.375 0 0 1 11.964-3.07
                                 M12 6.375a3.375 3.375 0 1 1-6.75 0
                                 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25
                                 a2.625 2.625 0 1 1-5.25 0
                                 2.625 2.625 0 0 1 5.25 0Z"/>
                    </svg>

                    Customers
                </a>

                <!-- Enquiries -->
                <a th:href="@{/admin/enquiries}"
                   class="flex items-center gap-3 rounded-xl px-4 py-3
                            text-sm font-medium transition"
                   th:classappend="${activeMenu == 'enquiries'}
                       ? ' bg-emerald-500 text-slate-950'
                       : ' hover:bg-white/10 hover:text-white'">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M8.625 12a.375.375 0 1 1-.75 0
                                 .375.375 0 0 1 .75 0Zm3.75 0
                                 a.375.375 0 1 1-.75 0
                                 .375.375 0 0 1 .75 0Zm3.75 0
                                 a.375.375 0 1 1-.75 0
                                 .375.375 0 0 1 .75 0ZM21 12
                                 c0 4.556-4.03 8.25-9 8.25
                                 a9.76 9.76 0 0 1-4.555-1.098
                                 L3 20.25l1.256-3.351A7.83 7.83 0 0 1
                                 3 12c0-4.556 4.03-8.25 9-8.25s9 3.694 9 8.25Z"/>
                    </svg>

                    Enquiries
                </a>

            </nav>

    </section>
    <footer class="border-t border-white/10 px-6 py-4">

        <p class="text-center text-xs leading-5 text-slate-500">
            &copy;
            <span th:text="${#dates.year(#dates.createNow())}">
            2026
        </span>
            Preethi KJ
        </p>

        <p class="text-center text-xs text-slate-600">
            All rights reserved.
        </p>

    </footer>
</aside>

</body>
</html>
