<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="localitySearch"
         class="relative rounded-3xl border border-white/10 bg-slate-900 p-5 shadow-xl">

  <p class="text-sm font-semibold uppercase tracking-widest text-emerald-400">
    Search within Bangalore
  </p>

  <div class="mt-4 flex items-center rounded-full border border-white/10 bg-slate-950 px-5 py-3">
    <input id="localityInput"
           type="text"
           placeholder="Enter locality or area"
           class="w-full bg-transparent text-sm text-white outline-none placeholder:text-slate-500">
  </div>

  <section id="localitySuggestions"
           class="absolute left-0 right-0 top-full z-20 mt-3 hidden overflow-hidden rounded-3xl border border-white/10 bg-slate-900 shadow-2xl">

    <p class="px-5 py-3 text-xs font-bold uppercase tracking-widest text-slate-500">
      Popular Localities
    </p>

    <button type="button" class="locality-option block w-full px-5 py-3 text-left text-slate-300 hover:bg-emerald-500 hover:text-slate-950">Whitefield</button>
    <button type="button" class="locality-option block w-full px-5 py-3 text-left text-slate-300 hover:bg-emerald-500 hover:text-slate-950">Indiranagar</button>
    <button type="button" class="locality-option block w-full px-5 py-3 text-left text-slate-300 hover:bg-emerald-500 hover:text-slate-950">Electronic City</button>
    <button type="button" class="locality-option block w-full px-5 py-3 text-left text-slate-300 hover:bg-emerald-500 hover:text-slate-950">JP Nagar</button>
    <button type="button" class="locality-option block w-full px-5 py-3 text-left text-slate-300 hover:bg-emerald-500 hover:text-slate-950">Yelahanka</button>
  </section>

</section>

</body>
</html>
