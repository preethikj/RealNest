<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<form id="propertySearchForm"
      th:fragment="searchBar"
      th:action="@{/properties}"
      method="get"
      class="relative z-30 rounded-3xl border border-white/15
               bg-white/10 p-4 shadow-2xl backdrop-blur-xl">

    <fieldset class="grid gap-3 md:grid-cols-4">

        <legend class="sr-only">
            Search properties
        </legend>

        <!-- Dynamic city search -->
        <div class="relative md:col-span-2">

            <label for="searchCity" class="sr-only">
                City
            </label>

            <input id="searchCity"
                   name="city"
                   type="text"
                   placeholder="Enter city"
                   autocomplete="off"
                   class="w-full rounded-2xl bg-white px-4 py-4 pr-12
                    text-slate-900 outline-none">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="2"
                 stroke="currentColor"
                 aria-hidden="true"
                 class="pointer-events-none absolute right-3 top-7
            h-5 w-5 -translate-y-1/2 text-slate-700">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
            </svg>

            <!-- Custom dynamic city suggestions -->
            <section id="citySuggestions"
                     th:if="${availableCities != null
                      and !availableCities.isEmpty()}"
                     class="absolute left-0 right-0 top-full z-50
                           mt-3 hidden overflow-hidden rounded-3xl
                           border border-white/10 bg-slate-900
                           shadow-2xl">

                <p class="px-5 py-3 text-xs font-bold uppercase
                  tracking-widest text-slate-500">
                    Available Cities
                </p>

                <button th:each="city : ${availableCities}"
                            type="button"
                            class="city-option block w-full px-5 py-3
                                   text-left text-slate-300 transition
                                   hover:bg-emerald-500 hover:text-slate-950"
                        th:text="${city}">
                    City
                </button>
            </section>

        </div>

        <div class="relative">

            <label for="listingType" class="sr-only">
                Listing Type
            </label>

            <select id="listingType"
                    name="listingType"
                    class="w-full appearance-none rounded-2xl bg-white
                   px-4 py-4 pr-12 text-slate-900 outline-none">

                <option value="SALE">Buy</option>
                <option value="RENT">Rent</option>

            </select>

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="2"
                 stroke="currentColor"
                 aria-hidden="true"
                 class="pointer-events-none absolute right-3 top-1/2
                h-5 w-5 -translate-y-1/2 text-slate-700">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m19.5 8.25-7.5 7.5-7.5-7.5"/>
            </svg>

        </div>

        <button th:replace="~{fragments/buttons ::
                primaryButton('Search', 'submit')}">
        </button>

    </fieldset>

</form>

</body>
</html>
