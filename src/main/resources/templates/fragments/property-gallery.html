<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="propertyGallery"
         class="max-w-7xl mx-auto px-6 pt-10">

    <section class="grid gap-4 lg:grid-cols-4 lg:grid-rows-2">

        <img id="mainPropertyImage"
             src="/images/property-1.jpg"
             alt="Property main view"
             class="h-[420px] w-full rounded-3xl object-cover lg:col-span-3 lg:row-span-2">

        <img src="/images/property-2.jpg"
             data-gallery-image="/images/property-2.jpg"
             alt="Property interior view"
             class="gallery-thumbnail hidden h-[202px] w-full cursor-pointer rounded-2xl object-cover lg:block">

        <button id="openGalleryModal"
                type="button"
                class="relative hidden h-[202px] cursor-pointer overflow-hidden rounded-2xl lg:block">

            <img src="/images/property-3.jpg"
                 alt="More property photos"
                 class="h-full w-full object-cover">

            <span class="absolute inset-0 flex items-center justify-center bg-slate-950/65">
                <span class="rounded-full bg-white/15 px-5 py-2 text-sm font-bold text-white backdrop-blur">
                    +12 Photos
                </span>
            </span>
        </button>

    </section>
    <section id="galleryModal"
             class="fixed inset-0 z-50 hidden bg-slate-950/95
                p-6 text-white">

        <section class="mx-auto flex h-full max-w-6xl flex-col">

            <section class="mb-4 flex items-center justify-between">
                <p class="text-lg font-bold">Property Photos</p>

                <button id="closeGalleryModal"
                        type="button"
                        aria-label="Close gallery"
                        class="flex h-10 w-10 items-center justify-center
                        rounded-full bg-black/70 backdrop-blur text-white
                        shadow-lg transition-all duration-200 hover:bg-emerald-500 hover:text-slate-950">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor"
                         class="h-5 w-5">

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M6 18L18 6M6 6l12 12"/>

                    </svg>
                </button>
            </section>

            <section class="relative flex flex-1 items-center justify-center">

                <button id="previousGalleryImage"
                        type="button"
                        aria-label="Previous image"
                        class="absolute left-4 z-10 flex h-10 w-10
                        items-center justify-center rounded-full
                        bg-black/70 backdrop-blur shadow-lg text-white
                        transition-all duration-200 hover:bg-emerald-500 hover:text-slate-950">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M15.75 19.5L8.25 12l7.5-7.5"/>
                    </svg>

                </button>

                <img id="modalGalleryImage"
                     src="/images/property-1.jpg"
                     alt="Property gallery image"
                     class="max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain">

                <button id="nextGalleryImage"
                        type="button"
                        aria-label="Next image"
                        class="absolute right-4 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-black/70 backdrop-blur shadow-lg text-white transition-all duration-200 hover:bg-emerald-500 hover:text-slate-950">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M8.25 4.5L15.75 12l-7.5 7.5"/>
                    </svg>

                </button>

            </section>

            <p id="galleryCounter"
               class="mt-4 text-center text-sm font-semibold text-slate-300">
                1 / 6
            </p>

        </section>

        <span class="gallery-image-source max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain transition-opacity duration-200" data-gallery-image="/images/property-1.jpg"></span>
        <span class="gallery-image-source max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain transition-opacity duration-200" data-gallery-image="/images/property-2.jpg"></span>
        <span class="gallery-image-source max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain transition-opacity duration-200" data-gallery-image="/images/property-3.jpg"></span>
        <span class="gallery-image-source max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain transition-opacity duration-200" data-gallery-image="/images/property-4.jpg"></span>
        <span class="gallery-image-source max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain transition-opacity duration-200" data-gallery-image="/images/property-5.jpg"></span>
        <span class="gallery-image-source max-h-[78vh] w-full max-w-5xl rounded-3xl object-contain transition-opacity duration-200" data-gallery-image="/images/property-6.jpg"></span>

    </section>

</section>

</body>
</html>
