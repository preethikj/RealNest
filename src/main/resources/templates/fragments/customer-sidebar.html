<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<aside th:fragment="customerSidebar(activeMenu)"
       class="fixed top-[73px] left-0 bottom-0 hidden lg:flex w-64 flex-col
              bg-slate-950 border-r border-white/10 text-slate-300">


    <section class="flex-1 px-4 py-6">

        <div class="px-3 mb-6">
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-slate-500">
                Customer Portal
            </p>
        </div>

        <nav aria-label="Customer Navigation">
            <ul class="space-y-2">

                <li>
                    <a th:href="@{/customer/dashboard}"
                       class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition"
                       th:classappend="${activeMenu == 'dashboard'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M3.75 3v7.5h7.5V3h-7.5Zm9 0v4.5h7.5V3h-7.5Zm0 6v12h7.5V9h-7.5Zm-9 3v9h7.5v-9h-7.5Z"/>
                        </svg>

                        <span>Dashboard</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/customer/property/create}"
                       class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition"
                       th:classappend="${activeMenu == 'post-property'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M12 4.5v15m7.5-7.5h-15"/>
                        </svg>

                        <span>Post Property</span>
                    </a>
                </li>

                <li>
                    <a th:href="@{/customer/profile}"
                       class="flex items-center gap-3 rounded-xl px-4 py-3 text-sm font-medium transition"
                       th:classappend="${activeMenu == 'profile'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 21a7.5 7.5 0 0 1 15 0"/>
                        </svg>

                        <span>Profile</span>
                    </a>
                </li>

            </ul>
        </nav>
    </section>

    <section class="border-t border-white/10 p-4">

        <form th:action="@{/logout}" method="post">

            <button type="submit"
                    class="flex w-full items-center gap-3 rounded-xl px-4 py-3
                           text-sm font-medium text-rose-400 transition
                           hover:bg-rose-500/10 hover:text-rose-300">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="h-5 w-5">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6A2.25 2.25 0 0 0 5.25 5.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3-6 3 3m0 0-3 3m3-3H9"/>
                </svg>

                <span>Logout</span>
            </button>

        </form>

    </section>

</aside>
<section th:fragment="customerMobileMenu(activeMenu)">

    <!-- Backdrop -->
    <div id="customerMenuBackdrop"
         class="fixed inset-0 z-40 hidden bg-slate-950/60 backdrop-blur-sm lg:hidden">
    </div>

    <!-- Mobile customer menu -->
    <aside id="customerMobileMenu"
           aria-label="Customer mobile navigation"
           class="fixed right-0 top-[81px] z-50 hidden h-[calc(100vh-81px)]
                  w-full max-w-sm flex-col border-l border-white/10
                  bg-slate-950 text-slate-300 shadow-2xl lg:hidden">

        <header class="flex items-center justify-between border-b border-white/10 px-6 py-5">

            <div>
                <p class="text-xs font-semibold uppercase tracking-[0.2em]
                          text-emerald-400">
                    Customer Portal
                </p>

                <p class="mt-1 text-sm text-slate-400">
                    Manage your RealNest account
                </p>
            </div>

            <button id="customerMenuCloseButton"
                    type="button"
                    aria-label="Close customer navigation"
                    class="inline-flex h-10 w-10 items-center justify-center
                           rounded-full border border-white/10 text-slate-300
                           transition hover:border-emerald-400
                           hover:text-emerald-400">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="h-5 w-5">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M6 18 18 6M6 6l12 12"/>
                </svg>

            </button>

        </header>

        <nav class="flex-1 overflow-y-auto px-4 py-6"
             aria-label="Customer Navigation">

            <ul class="space-y-2">

                <li>
                    <a th:href="@{/customer/dashboard}"
                       class="customer-mobile-link flex items-center gap-3
                              rounded-xl px-4 py-3 text-sm font-semibold transition"
                       th:classappend="${activeMenu == 'dashboard'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M3.75 3v7.5h7.5V3h-7.5Zm9 0v4.5h7.5V3h-7.5Zm0 6v12h7.5V9h-7.5Zm-9 3v9h7.5v-9h-7.5Z"/>
                        </svg>

                        Dashboard
                    </a>
                </li>

                <li>
                    <a th:href="@{/customer/property/create}"
                       class="customer-mobile-link flex items-center gap-3
                              rounded-xl px-4 py-3 text-sm font-semibold transition"
                       th:classappend="${activeMenu == 'post-property'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M12 4.5v15m7.5-7.5h-15"/>
                        </svg>

                        Post Property
                    </a>
                </li>

                <li>
                    <a th:href="@{/customer/profile}"
                       class="customer-mobile-link flex items-center gap-3
                              rounded-xl px-4 py-3 text-sm font-semibold transition"
                       th:classappend="${activeMenu == 'profile'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">
                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0
                                     3.75 3.75 0 0 1 7.5 0ZM4.5 21a7.5
                                     7.5 0 0 1 15 0"/>
                        </svg>

                        Profile
                    </a>
                </li>

            </ul>

        </nav>

        <footer class="border-t border-white/10 p-4">

            <form th:action="@{/logout}" method="post">

                <button type="submit"
                        class="flex w-full items-center gap-3 rounded-xl
                               px-4 py-3 text-sm font-semibold text-rose-400
                               transition hover:bg-rose-500/10
                               hover:text-rose-300">

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="1.8"
                         stroke="currentColor"
                         class="h-5 w-5">
                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M15.75 9V5.25A2.25 2.25 0 0 0
                                 13.5 3h-6A2.25 2.25 0 0 0
                                 5.25 5.25v13.5A2.25 2.25 0 0 0
                                 7.5 21h6a2.25 2.25 0 0 0
                                 2.25-2.25V15m3-6 3 3m0 0-3
                                 3m3-3H9"/>
                    </svg>

                    Logout
                </button>

            </form>

        </footer>

    </aside>

</section>
</body>
</html>
