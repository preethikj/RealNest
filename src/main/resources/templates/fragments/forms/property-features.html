<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="propertyFeatures"
         class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">

    <header class="mb-6">

        <p class="text-sm font-semibold uppercase tracking-[0.2em]
                  text-emerald-600">
            Property Features
        </p>

        <h2 class="mt-2 text-xl font-bold text-slate-950">
            Features & Specifications
        </h2>

        <p class="mt-1 text-sm text-slate-500">
            Provide the essential details about your property.
        </p>

    </header>

    <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-4">

        <th:block th:replace="~{fragments/forms/form-controls ::
            textInput(
                'bedrooms',
                'bedrooms',
                'Bedrooms',
                'e.g. 3',
                'number',
                true
            )}">
        </th:block>

        <th:block th:replace="~{fragments/forms/form-controls ::
            textInput(
                'bathrooms',
                'bathrooms',
                'Bathrooms',
                'e.g. 2',
                'number',
                true
            )}">
        </th:block>

        <th:block th:replace="~{fragments/forms/form-controls ::
            textInput(
                'area',
                'area',
                'Area (sq.ft)',
                'e.g. 1450',
                'number',
                true
            )}">
        </th:block>

        <div>

            <label class="mb-2 block text-sm font-semibold text-slate-700">
                Furnishing
                <span class="text-rose-500">*</span>
            </label>

            <select
                    class="w-full rounded-2xl border border-slate-300
                           bg-white px-4 py-3
                           outline-none transition
                           focus:border-emerald-500
                           focus:ring-4 focus:ring-emerald-500/10">

                <option selected disabled>Select Furnishing</option>
                <option>Fully Furnished</option>
                <option>Semi Furnished</option>
                <option>Unfurnished</option>

            </select>

        </div>

    </div>

</section>

</body>
</html>
