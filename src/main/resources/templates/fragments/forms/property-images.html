<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="propertyImages"
         class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm">

    <header class="mb-6">

        <p class="text-sm font-semibold uppercase tracking-[0.2em]
                  text-emerald-600">
            Property Images
        </p>

        <h2 class="mt-2 text-xl font-bold text-slate-950">
            Upload Property Photos
        </h2>

        <p class="mt-1 text-sm text-slate-500">
            Add clear images that showcase the property.
        </p>

    </header>

    <label for="propertyImages"
           class="group flex min-h-64 cursor-pointer flex-col items-center
                  justify-center rounded-3xl border-2 border-dashed
                  border-slate-300 bg-slate-50 px-6 py-10 text-center
                  transition hover:border-emerald-400 hover:bg-emerald-50/40">

        <div class="flex h-16 w-16 items-center justify-center rounded-2xl
                    bg-emerald-100 text-emerald-700 transition
                    group-hover:scale-105">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.8"
                 stroke="currentColor"
                 class="h-8 w-8">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3 16.5V18a2.25 2.25 0 0 0 2.25 2.25h13.5A2.25 2.25 0 0 0 21 18v-1.5M16.5 8.25 12 3.75m0 0L7.5 8.25M12 3.75V15"/>
            </svg>

        </div>

        <h3 class="mt-5 text-lg font-bold text-slate-950">
            Drag and drop property images here
        </h3>

        <p class="mt-2 text-sm text-slate-500">
            or click to browse files from your device
        </p>

        <span class="mt-5 inline-flex items-center justify-center rounded-full
                     bg-emerald-500 px-5 py-2.5 text-sm font-semibold
                     text-slate-950 shadow-lg shadow-emerald-500/20
                     transition group-hover:bg-emerald-400">
            Browse Files
        </span>

        <input id="propertyImages"
               name="propertyImages"
               type="file"
               accept="image/png,image/jpeg,image/webp"
               multiple
               class="sr-only">

    </label>

    <div class="mt-4 flex flex-col gap-2 text-xs text-slate-500 sm:flex-row sm:justify-between">

        <p>
            Supported formats: JPG, PNG and WEBP
        </p>

        <p>
            Upload up to 8 images
        </p>

    </div>

    <section id="imagePreviewSection"
             class="mt-6 hidden">

        <div class="mb-4 flex items-center justify-between">

            <div>
                <h3 class="font-bold text-slate-950">
                    Image Preview
                </h3>

                <p class="mt-1 text-xs text-slate-500">
                    The first image will be used as the cover photo.
                </p>
            </div>

            <button id="clearImagesButton"
                    type="button"
                    class="text-sm font-semibold text-rose-600 transition
                           hover:text-rose-700">
                Clear all
            </button>

        </div>

        <div id="imagePreviewGrid"
             class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4">
        </div>

    </section>

</section>

</body>
</html>
