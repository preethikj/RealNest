<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="listingInformation"
         class="rounded-3xl border border-slate-200
                bg-white p-6 shadow-sm">

    <header class="mb-6">

        <p class="text-sm font-semibold uppercase tracking-[0.2em]
                  text-emerald-600">
            Listing Information
        </p>

        <h2 class="mt-2 text-xl font-bold text-slate-950">
            Listing Details
        </h2>

        <p class="mt-1 text-sm text-slate-500">
            Choose the listing type and basic pricing information.
        </p>

    </header>

    <div class="grid gap-6 md:grid-cols-3">

        <div>

            <label for="listingType"
                   class="mb-2 block text-sm font-semibold text-slate-700">
                Listing Type
                <span class="text-rose-500">*</span>
            </label>

            <select id="listingType"
                    th:field="*{listingType}"
                    th:classappend="${#fields.hasErrors('listingType')}
                        ? ' border-rose-400 focus:border-rose-500'
                        : ' border-slate-300 focus:border-emerald-500'"
                    class="w-full rounded-2xl border bg-white
                           px-4 py-3 outline-none transition
                           focus:ring-4 focus:ring-emerald-500/10">

                <option value="">Select Listing Type</option>
                <option value="SALE">Sale</option>
                <option value="RENT">Rent</option>

            </select>

            <p th:if="${#fields.hasErrors('listingType')}"
               th:errors="*{listingType}"
               class="mt-2 text-sm text-rose-600">
            </p>

        </div>

        <div>

            <label for="propertyType"
                   class="mb-2 block text-sm font-semibold text-slate-700">
                Property Type
                <span class="text-rose-500">*</span>
            </label>

            <select id="propertyType"
                    th:field="*{propertyType}"
                    th:classappend="${#fields.hasErrors('propertyType')}
                        ? ' border-rose-400 focus:border-rose-500'
                        : ' border-slate-300 focus:border-emerald-500'"
                    class="w-full rounded-2xl border bg-white
                           px-4 py-3 outline-none transition
                           focus:ring-4 focus:ring-emerald-500/10">

                <option value="">Select Property Type</option>
                <option value="APARTMENT">Apartment</option>
                <option value="VILLA">Villa</option>
                <option value="INDEPENDENT_HOUSE">
                    Independent House
                </option>
                <option value="PLOT">Plot</option>
                <option value="COMMERCIAL">Commercial</option>

            </select>

            <p th:if="${#fields.hasErrors('propertyType')}"
               th:errors="*{propertyType}"
               class="mt-2 text-sm text-rose-600">
            </p>

        </div>

        <div>
            <th:block th:replace="~{fragments/forms/form-controls ::
                textInput(
                    'price',
                    'price',
                    'Price',
                    'Enter property price',
                    'number',
                    true
                )}">
            </th:block>
        </div>

    </div>

</section>

</body>
</html>
