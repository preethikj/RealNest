<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<section th:fragment="formActions"
         class="flex flex-col-reverse gap-4
                border-t border-slate-200 pt-8
                sm:flex-row sm:justify-end">

    <a th:href="@{/customer/dashboard}"
       data-loading-cancel
       class="inline-flex items-center justify-center
              rounded-full border border-slate-300 bg-white
              px-6 py-3 text-sm font-semibold text-slate-700
              transition hover:border-emerald-400
              hover:bg-emerald-50 hover:text-emerald-700">
        Cancel
    </a>

    <th:block th:replace="~{fragments/buttons ::
        loadingSubmitButton(
            ${editMode
                ? 'Update Property'
                : 'Submit for Approval'},
            ${editMode
                ? 'Updating...'
                : 'Submitting...'}
        )}">
    </th:block>

</section>

</body>

</html>
