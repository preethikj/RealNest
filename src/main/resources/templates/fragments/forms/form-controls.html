<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="textInput(
        id,
        name,
        label,
        placeholder,
        type,
        required
     )">

    <label th:for="${id}"
           class="mb-2 block text-sm font-semibold text-slate-700">

        <span th:text="${label}">Label</span>

        <span th:if="${required}"
              class="text-rose-500">
      *
    </span>

    </label>

    <input th:field="*{__${name}__}"
           th:id="${id}"
           th:type="${type}"
           th:placeholder="${placeholder}"
           th:classappend="${#fields.hasErrors(name)}
                         ? ' border-rose-400 focus:border-rose-500
                             focus:ring-rose-500/10'
                         : ' border-slate-300 focus:border-emerald-500
                             focus:ring-emerald-500/10'"
           class="w-full rounded-2xl border bg-white
                px-4 py-3 text-slate-900
                placeholder:text-slate-400
                outline-none transition focus:ring-4">

    <p th:if="${#fields.hasErrors(name)}"
       th:errors="*{__${name}__}"
       class="mt-2 text-sm text-rose-600">
        Invalid value
    </p>

</div>


<div th:fragment="textarea(
        id,
        name,
        label,
        placeholder,
        rows,
        required,
        helperText
     )">

    <label th:for="${id}"
           class="mb-2 block text-sm font-semibold text-slate-700">

        <span th:text="${label}">Label</span>

        <span th:if="${required}"
              class="text-rose-500">
      *
    </span>

    </label>

    <textarea th:field="*{__${name}__}"
              th:id="${id}"
              th:rows="${rows}"
              th:placeholder="${placeholder}"
              th:classappend="${#fields.hasErrors(name)}
                            ? ' border-rose-400 focus:border-rose-500
                                focus:ring-rose-500/10'
                            : ' border-slate-300 focus:border-emerald-500
                                focus:ring-emerald-500/10'"
              class="w-full resize-none rounded-2xl border
                   bg-white px-4 py-3 text-slate-900
                   placeholder:text-slate-400
                   outline-none transition focus:ring-4">
  </textarea>

    <p th:if="${#fields.hasErrors(name)}"
       th:errors="*{__${name}__}"
       class="mt-2 text-sm text-rose-600">
        Invalid value
    </p>

    <p th:if="${!#fields.hasErrors(name)
              and helperText != null
              and !#strings.isEmpty(helperText)}"
       th:text="${helperText}"
       class="mt-2 text-xs text-slate-500">
    </p>

</div>

</body>
</html>
