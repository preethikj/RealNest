<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="textInput(
        id,
        name,
        label,
        placeholder,
        type,
        required
     )">

  <label th:for="${id}"
         class="mb-2 block text-sm font-semibold text-slate-700">

    <span th:text="${label}">Label</span>

    <span th:if="${required}"
          class="text-rose-500">
            *
        </span>
  </label>

  <input th:id="${id}"
         th:name="${name}"
         th:type="${type}"
         th:placeholder="${placeholder}"
         class="w-full rounded-2xl border border-slate-300
                  bg-white px-4 py-3 text-slate-900
                  placeholder:text-slate-400
                  outline-none transition
                  focus:border-emerald-500
                  focus:ring-4 focus:ring-emerald-500/10">

</div>


<div th:fragment="textarea(
        id,
        name,
        label,
        placeholder,
        rows,
        required,
        helperText
     )">

  <label th:for="${id}"
         class="mb-2 block text-sm font-semibold text-slate-700">

    <span th:text="${label}">Label</span>

    <span th:if="${required}"
          class="text-rose-500">
            *
        </span>
  </label>

  <textarea th:id="${id}"
            th:name="${name}"
            th:rows="${rows}"
            th:placeholder="${placeholder}"
            class="w-full resize-none rounded-2xl
                     border border-slate-300 bg-white
                     px-4 py-3 text-slate-900
                     placeholder:text-slate-400
                     outline-none transition
                     focus:border-emerald-500
                     focus:ring-4 focus:ring-emerald-500/10"></textarea>

  <p th:if="${helperText != null and !#strings.isEmpty(helperText)}"
     th:text="${helperText}"
     class="mt-2 text-xs text-slate-500">
  </p>

</div>

</body>
</html>
