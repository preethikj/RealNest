<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<article th:fragment="propertyCard"
         class="group overflow-hidden rounded-3xl border border-white/10 bg-slate-900 shadow-xl transition hover:-translate-y-1 hover:border-emerald-400/40 hover:shadow-emerald-500/10">

    <section class="relative">
        <img src="/images/property-1.jpg"
             alt="Modern apartment"
             class="h-60 w-full object-cover transition duration-500 group-hover:scale-105">

        <span class="absolute left-4 top-4 rounded-full bg-emerald-500 px-4 py-1 text-xs font-bold text-slate-950">
            FOR SALE
        </span>

        <div class="absolute right-4 top-4">
            <button type="button"
                    aria-label="Add to wishlist"
                    class="inline-flex h-11 w-11 items-center justify-center rounded-full border border-white/15 bg-slate-950/70 text-slate-300 backdrop-blur transition hover:border-emerald-400 hover:text-emerald-400">
                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="h-5 w-5">
                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M21 8.25c0-2.485-2.014-4.5-4.5-4.5-1.74 0-3.25.99-4 2.438A4.493 4.493 0 008.5 3.75C6.014 3.75 4 5.765 4 8.25c0 7.22 8.5 11.25 8.5 11.25S21 15.47 21 8.25z"/>
                </svg>
            </button>
        </div>
    </section>

    <section class="p-5">
        <p class="text-2xl font-bold text-emerald-400">₹85 L</p>

        <h2 class="mt-2 text-xl font-bold text-white">
            Modern Luxury Apartment
        </h2>

        <p class="mt-1 text-sm text-slate-400">
            Indiranagar, Bangalore
        </p>

        <ul class="mt-5 flex flex-wrap gap-3 text-sm text-slate-300">
            <li class="rounded-full bg-white/5 px-3 py-1">3 BHK</li>
            <li class="rounded-full bg-white/5 px-3 py-1">2 Bath</li>
            <li class="rounded-full bg-white/5 px-3 py-1">1450 sqft</li>
        </ul>

        <div class="mt-6">
            <th:block th:replace="~{fragments/buttons :: primaryLink('View Details', '/properties/1')}"></th:block>
        </div>
    </section>

</article>
<article th:fragment="customerPropertyCard(
            imageUrl,
            imageAlt,
            title,
            location,
            listingType,
            price,
            status,
            viewUrl,
            editUrl,
            deleteUrl
         )"
         class="group overflow-hidden rounded-3xl border border-slate-200
                bg-white shadow-sm transition duration-300
                hover:-translate-y-1 hover:shadow-lg">

    <section class="relative h-60 overflow-hidden">

        <img th:src="${imageUrl}"
             th:alt="${imageAlt}"
             class="h-full w-full object-cover transition duration-500
                    group-hover:scale-105">

        <span class="absolute left-4 top-4 rounded-full bg-slate-950/90 px-4 py-1
                     text-xs font-bold text-white backdrop-blur"
              th:text="${listingType == 'SALE' ? 'FOR SALE' : 'FOR RENT'}">
            FOR SALE
        </span>

        <span class="absolute right-4 top-4 rounded-full px-4 py-1
                     text-xs font-bold"
              th:text="${status}"
              th:classappend="
                    ${status == 'APPROVED'}
                        ? ' bg-emerald-100 text-emerald-700'
                        : (${status == 'PENDING'}
                            ? ' bg-amber-100 text-amber-700'
                            : ' bg-rose-100 text-rose-700')">
            APPROVED
        </span>

    </section>

    <section class="p-5">

        <p class="text-2xl font-bold text-emerald-600"
           th:text="${price}">
            ₹85 L
        </p>

        <h2 class="mt-2 truncate text-xl font-bold text-slate-950"
            th:text="${title}">
            Modern Luxury Apartment
        </h2>

        <p class="mt-1 truncate text-sm text-slate-500"
           th:text="${location}">
            Indiranagar, Bangalore
        </p>

        <div class="mt-6 flex items-center gap-2 border-t border-slate-100 pt-4">

            <th:block th:replace="~{fragments/buttons :: outlineLink('View', '#')}"></th:block>

            <th:block th:replace="~{fragments/buttons :: outlineLink('Edit', '#')}"></th:block>

            <th:block th:replace="~{fragments/buttons :: deleteButton('Delete', 'submit')}"></th:block>

        </div>

    </section>

</article>
</body>
</html>
