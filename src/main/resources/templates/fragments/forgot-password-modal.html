<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<body>

<th:block th:fragment="forgotPasswordModal">

  <div id="forgotPasswordModal"
       role="dialog"
       aria-modal="true"
       aria-labelledby="forgotPasswordTitle"
       class="fixed inset-0 z-50 hidden items-center
                justify-center bg-black/70 px-6 backdrop-blur-sm">

    <section class="w-full max-w-md rounded-3xl
                        border border-white/10
                        bg-slate-900 p-6 shadow-2xl
                        shadow-black/40 sm:p-8">

      <header class="mb-6">

        <div class="mb-5 inline-flex items-center justify-center
                            rounded-2xl border border-emerald-400/20
                            bg-emerald-400/10 p-3 text-emerald-400">

          <svg xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke-width="1.8"
               stroke="currentColor"
               class="h-6 w-6">

            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16.5 10.5V6.75a4.5 4.5
                                 0 0 0-9 0v3.75m-.75 0h10.5
                                 A2.25 2.25 0 0 1 19.5 12.75
                                 v6A2.25 2.25 0 0 1 17.25 21
                                 H6.75A2.25 2.25 0 0 1 4.5
                                 18.75v-6a2.25 2.25 0 0 1
                                 2.25-2.25Z"/>

          </svg>

        </div>

        <h2 id="forgotPasswordTitle"
            class="text-2xl font-bold text-white">
          Reset your password
        </h2>

        <p class="mt-2 text-sm leading-6 text-slate-400">
          Enter your registered email address. We’ll send
          you a secure password-reset link.
        </p>

      </header>

      <form th:action="@{/auth/forgot-password}"
            method="post"
            class="space-y-5"
            data-auth-form>

        <div>

          <label for="forgotPasswordEmail"
                 class="mb-2 block text-sm font-medium
                                  text-slate-200">
            Email address
          </label>

          <input id="forgotPasswordEmail"
                 name="email"
                 type="email"
                 autocomplete="email"
                 required
                 placeholder="you@example.com"
                 class="w-full rounded-2xl border
                                  border-white/10 bg-slate-950/70
                                  px-4 py-3.5 text-sm text-white
                                  outline-none transition
                                  placeholder:text-slate-600
                                  focus:border-emerald-400
                                  focus:ring-4
                                  focus:ring-emerald-400/10">

        </div>

        <div class="flex flex-col-reverse gap-3 sm:flex-row
                            sm:justify-end">

          <button type="button"
                  id="closeForgotPasswordModal"
                  class="inline-flex items-center justify-center
                                   rounded-full border border-white/15
                                   px-6 py-3 text-sm font-semibold
                                   text-slate-200 transition
                                   hover:border-emerald-400
                                   hover:text-emerald-400">
            Cancel
          </button>

          <th:block
                  th:replace="~{fragments/buttons
                            :: loadingSubmitButton(
                            'Send reset link',
                            'Sending link...'
                            )}">
          </th:block>

        </div>

      </form>

    </section>

  </div>

</th:block>

</body>
</html>
