<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<nav id="navbar"
     th:fragment="navbar"
     aria-label="Primary Navigation"
     class="fixed top-0 left-0 right-0 z-50 bg-slate-950/80 backdrop-blur-xl border-b border-white/10 transition-all duration-300">

    <section class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

        <a href="/"
           class="flex items-center gap-2 text-2xl font-bold tracking-tight text-white">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.8"
                 stroke="currentColor"
                 class="w-8 h-8 text-emerald-400">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.25 12L12 3l9.75 9M4.5 9.75V21h15V9.75"/>
            </svg>

            <span>Real<span class="text-emerald-400">Nest</span></span>
        </a>

        <ul id="desktopMenu"
            class="hidden md:flex items-center gap-8 text-sm text-slate-300">
            <li><a href="/properties?listingType=SALE" class="hover:text-emerald-400 transition">Buy</a></li>
            <li><a href="/properties?listingType=RENT" class="hover:text-emerald-400 transition">Rent</a></li>
            <li><a href="/sell" class="hover:text-emerald-400 transition">Sell</a></li>
            <li><a href="/contact" class="hover:text-emerald-400 transition">Contact</a></li>
        </ul>

        <section class="hidden md:flex items-center gap-3">
            <a href="/auth/login"
               class="px-4 py-2 text-sm text-slate-300 hover:text-white transition">
                Login
            </a>

            <a href="/auth/register"
               class="px-5 py-2 rounded-full bg-emerald-500 text-slate-950 text-sm font-semibold hover:bg-emerald-400 transition">
                Register
            </a>
        </section>

        <button id="mobileMenuButton"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                class="md:hidden text-slate-200 hover:text-emerald-400 transition">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.8"
                 stroke="currentColor"
                 class="w-7 h-7">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
            </svg>
        </button>

    </section>

    <section id="mobileMenu"
             class="hidden md:hidden border-t border-white/10 bg-slate-950/95 backdrop-blur-xl">

        <ul class="px-6 py-5 space-y-4 text-slate-300">
            <li><a href="/properties?listingType=SALE" class="block hover:text-emerald-400 transition">Buy</a></li>
            <li><a href="/properties?listingType=RENT" class="block hover:text-emerald-400 transition">Rent</a></li>
            <li><a href="/sell" class="block hover:text-emerald-400 transition">Sell</a></li>
            <li><a href="/contact" class="block hover:text-emerald-400 transition">Contact</a></li>

            <li class="pt-4 border-t border-white/10">
                <a href="/auth/login" class="block hover:text-white transition">Login</a>
            </li>

            <li>
                <a href="/auth/register"
                   class="block text-center px-5 py-3 rounded-full bg-emerald-500 text-slate-950 font-semibold hover:bg-emerald-400 transition">
                    Register
                </a>
            </li>
        </ul>
    </section>

</nav>

</body>
</html>
