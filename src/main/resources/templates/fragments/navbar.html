<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<body>

<nav id="navbar"
     th:fragment="navbar(customerMode, activeMenu)"
     aria-label="Primary Navigation"
     class="fixed top-0 left-0 right-0 z-50
            border-b border-white/10
            bg-slate-950/80 backdrop-blur-xl
            transition-all duration-300">

    <section class="mx-auto flex h-20 max-w-7xl items-center justify-between px-6">

        <!-- Logo -->
        <a th:href="@{/}"
           class="flex items-center gap-2 text-2xl font-bold
                  tracking-tight text-white">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.8"
                 stroke="currentColor"
                 class="h-8 w-8 text-emerald-400">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.25 12L12 3l9.75 9M4.5 9.75V21h15V9.75"/>
            </svg>

            <span>
                Real<span class="text-emerald-400">Nest</span>
            </span>
        </a>


        <!-- Desktop navigation -->
        <ul id="desktopMenu"
            class="hidden items-center gap-8 text-sm text-slate-300 md:flex">

            <li>
                <a th:href="@{/properties(listingType='SALE')}"
                   class="transition hover:text-emerald-400">
                    Buy
                </a>
            </li>

            <li>
                <a th:href="@{/properties(listingType='RENT')}"
                   class="transition hover:text-emerald-400">
                    Rent
                </a>
            </li>

            <li>
                <a th:href="@{/customer/property/create}"
                   class="transition hover:text-emerald-400">
                    Sell
                </a>
            </li>

            <li>
                <a th:href="@{/contact}"
                   class="transition hover:text-emerald-400">
                    Contact
                </a>
            </li>

        </ul>


        <!-- Desktop public actions -->
        <section th:if="${!customerMode}"
                 class="hidden items-center gap-3 md:flex">

            <a th:href="@{/auth/login}"
               class="px-4 py-2 text-sm text-slate-300
                      transition hover:text-white">
                Login
            </a>

            <a th:href="@{/auth/register}"
               class="rounded-full bg-emerald-500 px-5 py-2
                      text-sm font-semibold text-slate-950
                      transition hover:bg-emerald-400">
                Register
            </a>

        </section>


        <!-- Desktop spacer for customer pages -->
        <div th:if="${customerMode}"
             class="hidden w-24 md:block">
        </div>


        <!-- Mobile hamburger -->
        <button id="mobileMenuButton"
                type="button"
                aria-label="Open navigation menu"
                aria-expanded="false"
                class="text-slate-200 transition
                       hover:text-emerald-400 md:hidden">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.8"
                 stroke="currentColor"
                 class="h-7 w-7">

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3.75 6.75h16.5
                         M3.75 12h16.5
                         m-16.5 5.25h16.5"/>
            </svg>

        </button>

    </section>


    <!-- Public mobile menu -->
    <section id="publicMobileMenu"
             th:if="${!customerMode}"
             class="hidden border-t border-white/10
                    bg-slate-950/95 backdrop-blur-xl md:hidden">

        <ul class="space-y-2 px-6 py-5 text-slate-300">

            <li>
                <a th:href="@{/properties(listingType='SALE')}"
                   class="block rounded-xl px-4 py-3 text-sm font-medium
                          transition hover:bg-white/10
                          hover:text-emerald-400">
                    Buy
                </a>
            </li>

            <li>
                <a th:href="@{/properties(listingType='RENT')}"
                   class="block rounded-xl px-4 py-3 text-sm font-medium
                          transition hover:bg-white/10
                          hover:text-emerald-400">
                    Rent
                </a>
            </li>

            <li>
                <a th:href="@{/customer/property/create}"
                   class="block rounded-xl px-4 py-3 text-sm font-medium
                          transition hover:bg-white/10
                          hover:text-emerald-400">
                    Sell
                </a>
            </li>

            <li>
                <a th:href="@{/contact}"
                   class="block rounded-xl px-4 py-3 text-sm font-medium
                          transition hover:bg-white/10
                          hover:text-emerald-400">
                    Contact
                </a>
            </li>

            <li class="mt-3 border-t border-white/10 pt-4">
                <a th:href="@{/auth/login}"
                   class="block rounded-xl px-4 py-3 text-sm font-medium
                          text-slate-300 transition hover:bg-white/10
                          hover:text-white">
                    Login
                </a>
            </li>

            <li class="pt-2">
                <a th:href="@{/auth/register}"
                   class="block rounded-full bg-emerald-500 px-5 py-3
                          text-center text-sm font-semibold text-slate-950
                          transition hover:bg-emerald-400">
                    Register
                </a>
            </li>

        </ul>

    </section>


    <!-- Customer mobile menu -->
    <section id="customerMobileMenu"
             th:if="${customerMode}"
             class="hidden border-t border-white/10
                    bg-slate-950/95 backdrop-blur-xl md:hidden">

        <nav aria-label="Customer Mobile Navigation">

            <ul class="space-y-2 px-6 py-5 text-slate-300">

                <!-- Dashboard -->
                <li>
                    <a th:href="@{/customer/dashboard}"
                       class="flex items-center gap-3 rounded-xl px-4 py-3
                              text-sm font-semibold transition"
                       th:classappend="${activeMenu == 'dashboard'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M3.75 3v7.5h7.5V3h-7.5
                                     Zm9 0v4.5h7.5V3h-7.5
                                     Zm0 6v12h7.5V9h-7.5
                                     Zm-9 3v9h7.5v-9h-7.5Z"/>
                        </svg>

                        <span>Dashboard</span>
                    </a>
                </li>

               <!-- Post Property -->
                <li>
                    <a th:href="@{/customer/property/create}"
                       class="flex items-center gap-3 rounded-xl px-4 py-3
                              text-sm font-semibold transition"
                       th:classappend="${activeMenu == 'post-property'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg mlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M12 4.5v15m7.5-7.5h-15"/>
                        </svg>

                        <span>Post Property</span>
                    </a>
                </li>


                <!-- Profile -->
                <li>
                    <a th:href="@{/customer/profile}"
                       class="flex items-center gap-3 rounded-xl px-4 py-3
                              text-sm font-semibold transition"
                       th:classappend="${activeMenu == 'profile'}
                           ? ' bg-emerald-500 text-slate-950'
                           : ' hover:bg-white/10 hover:text-white'">

                        <svg xmlns="http://www.w3.org/2000/svg"
                             fill="none"
                             viewBox="0 0 24 24"
                             stroke-width="1.8"
                             stroke="currentColor"
                             class="h-5 w-5">

                            <path stroke-linecap="round"
                                  stroke-linejoin="round"
                                  d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0
                                     3.75 3.75 0 0 1 7.5 0
                                     ZM4.5 21a7.5 7.5 0 0 1 15 0"/>
                        </svg>

                        <span>Profile</span>
                    </a>
                </li>


                <!-- Logout -->
                <li class="mt-4 border-t border-white/10 pt-4">

                    <form th:action="@{/logout}"
                          method="post">

                        <button type="submit"
                                class="flex w-full items-center gap-3
                                       rounded-xl px-4 py-3 text-sm
                                       font-semibold text-rose-400
                                       transition hover:bg-rose-500/10
                                       hover:text-rose-300">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke-width="1.8"
                                 stroke="currentColor"
                                 class="h-5 w-5">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M15.75 9V5.25A2.25 2.25 0 0 0
                                         13.5 3h-6A2.25 2.25 0 0 0
                                         5.25 5.25v13.5A2.25 2.25 0 0 0
                                         7.5 21h6a2.25 2.25 0 0 0
                                         2.25-2.25V15
                                         m3-6 3 3
                                         m0 0-3 3
                                         m3-3H9"/>
                            </svg>

                            <span>Logout</span>
                        </button>

                    </form>

                </li>

            </ul>

        </nav>

    </section>

</nav>

</body>
</html>
