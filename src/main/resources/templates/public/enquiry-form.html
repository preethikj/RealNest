<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${'RealNest | ' + pageTitle}">
        RealNest | Send Enquiry
    </title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 font-sans text-white">

<header th:replace="~{fragments/navbar :: navbar('PUBLIC', null)}">
</header>

<main class="pt-28">

    <section class="mx-auto max-w-5xl px-6 py-12">

        <a th:href="@{/properties/{id}(id=${property.id})}"
           class="inline-flex items-center gap-2 text-sm font-semibold
                  text-slate-400 transition hover:text-emerald-400">

            <svg xmlns="http://www.w3.org/2000/svg"
                 fill="none"
                 viewBox="0 0 24 24"
                 stroke-width="1.8"
                 stroke="currentColor"
                 aria-hidden="true"
                 class="h-4 w-4">
                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="m15 18-6-6 6-6"/>
            </svg>

            <span>Back to Property</span>

        </a>

        <section class="mt-8 grid gap-8 lg:grid-cols-3">

            <!-- Selected property -->
            <aside class="self-start rounded-3xl border border-white/10
                          bg-slate-900 p-6">

                <p class="text-sm font-semibold uppercase tracking-widest
                          text-emerald-400">
                    Enquiring About
                </p>

                <h1 class="mt-3 text-2xl font-bold"
                    th:text="${property.title}">
                    Property Title
                </h1>

                <p class="mt-3 text-sm text-slate-400"
                   th:text="${(property.locality != null
                              and !property.locality.isBlank()
                              ? property.locality + ', '
                              : '') + property.city}">
                    Property location
                </p>

                <p class="mt-5 text-2xl font-bold text-emerald-400"
                   th:text="${'₹' + #numbers.formatDecimal(
                        property.price,
                        1,
                        'COMMA',
                        0,
                        'POINT'
                   )}">
                    ₹0
                </p>

            </aside>

            <!-- Enquiry form -->
            <section class="rounded-3xl border border-white/10
                            bg-slate-900 p-6 lg:col-span-2">

                <header class="mb-7">

                    <p class="text-sm font-semibold uppercase
                              tracking-widest text-emerald-400">
                        Contact Property Owner
                    </p>

                    <h2 class="mt-2 text-3xl font-bold">
                        Send Enquiry
                    </h2>

                    <p class="mt-2 text-slate-400">
                        Enter your contact details and message.
                    </p>

                </header>

                <form th:action="@{/properties/{id}/enquiry(
                            id=${property.id}
                      )}"
                      th:object="${enquiryRequest}"
                      method="post"
                      class="space-y-5">

                    <div class="grid gap-5 sm:grid-cols-2">

                        <!-- Name -->
                        <div>
                            <label for="name"
                                   class="mb-2 block text-sm font-semibold">
                                Name
                            </label>

                            <input id="name"
                                   type="text"
                                   th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')}
                                        ? ' border-rose-400'
                                        : ' border-white/10'"
                                   class="w-full rounded-2xl border
                                          bg-slate-950 px-4 py-3 outline-none
                                          transition focus:border-emerald-400">

                            <p id="nameError"
                               th:if="${#fields.hasErrors('name')}"
                               th:errors="*{name}"
                               class="mt-2 text-sm text-rose-400">
                            </p>
                        </div>

                        <!-- Email -->
                        <div>
                            <label for="email"
                                   class="mb-2 block text-sm font-semibold">
                                Email
                            </label>

                            <input id="email"
                                   type="email"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')}
                                        ? ' border-rose-400'
                                        : ' border-white/10'"
                                   class="w-full rounded-2xl border
                                          bg-slate-950 px-4 py-3 outline-none
                                          transition focus:border-emerald-400">

                            <p id="emailError"
                               th:if="${#fields.hasErrors('email')}"
                               th:errors="*{email}"
                               class="mt-2 text-sm text-rose-400">
                            </p>
                        </div>

                    </div>

                    <!-- Phone -->
                    <div>
                        <label for="phone"
                               class="mb-2 block text-sm font-semibold">
                            Phone Number
                        </label>

                        <input id="phone"
                               type="tel"
                               inputmode="numeric"
                               th:field="*{phone}"
                               placeholder="10 to 15 digits"
                               th:classappend="${#fields.hasErrors('phone')}
                                    ? ' border-rose-400'
                                    : ' border-white/10'"
                               class="w-full rounded-2xl border bg-slate-950
                                      px-4 py-3 outline-none transition
                                      focus:border-emerald-400">

                        <p id="phoneError"
                           th:if="${#fields.hasErrors('phone')}"
                           th:errors="*{phone}"
                           class="mt-2 text-sm text-rose-400">
                        </p>
                    </div>

                    <!-- Message -->
                    <div>
                        <label for="message"
                               class="mb-2 block text-sm font-semibold">
                            Message
                        </label>

                        <textarea id="message"
                                  th:field="*{message}"
                                  rows="6"
                                  placeholder="I am interested in this property..."
                                  th:classappend="${#fields.hasErrors('message')}
                                        ? ' border-rose-400'
                                        : ' border-white/10'"
                                  class="w-full resize-y rounded-2xl border
                                         bg-slate-950 px-4 py-3 outline-none
                                         transition focus:border-emerald-400">
                        </textarea>

                        <p id="messageError"
                           th:if="${#fields.hasErrors('message')}"
                           th:errors="*{message}"
                           class="mt-2 text-sm text-rose-400">
                        </p>
                    </div>

                    <button type="submit"
                            class="w-full rounded-full bg-emerald-500
                                   px-6 py-3 font-bold text-slate-950
                                   transition hover:bg-emerald-400">
                        Send Enquiry
                    </button>

                </form>

            </section>

        </section>

    </section>

</main>

<footer th:replace="~{fragments/footer :: footer}">
</footer>

<script th:src="@{/js/navbar.js}"></script>
<script th:src="@{/js/enquiry-validation.js}"></script>

</body>
</html>
