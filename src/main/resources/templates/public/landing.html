<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>RealNest | Find Your Perfect Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white font-sans">

<header th:replace="~{fragments/navbar :: navbar('PUBLIC', null)}"></header>
<main>
    <th:block th:replace="~{fragments/hero :: hero}"></th:block>
    <section class="max-w-7xl mx-auto px-6 py-20">
        <th:block th:replace="~{fragments/section-header ::
            sectionHeader(
            'FEATURED PROPERTIES',
            'Handpicked Homes',
            'Explore premium verified homes carefully selected for you.',
            'View All',
            '/properties'
            )}">
        </th:block>

<!--        Property cards-->
        <section th:if="${!featuredProperties.isEmpty()}"
                 class="mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-3">

            <th:block th:each="property : ${featuredProperties}">
                <th:block th:replace="~{fragments/property-card ::
                    propertyCard(${property})}">
                </th:block>
            </th:block>

        </section>

        <section th:if="${featuredProperties.isEmpty()}"
                 class="mt-10 rounded-3xl border border-white/10
                bg-slate-900 px-6 py-14 text-center">

            <h2 class="text-xl font-bold text-white">
                No featured properties available
            </h2>

            <p class="mt-2 text-slate-400">
                New properties will appear here after approval.
            </p>

        </section>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="/js/navbar.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
