<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>RealNest | Find Your Perfect Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white font-sans">

<header th:replace="~{fragments/navbar :: navbar('PUBLIC', null)}"></header>
<main>
    <th:block th:replace="~{fragments/hero :: hero}"></th:block>
    <section class="max-w-7xl mx-auto px-6 py-20">
        <th:block th:replace="~{fragments/section-header ::
            sectionHeader(
            'FEATURED PROPERTIES',
            'Handpicked Homes',
            'Explore premium verified homes carefully selected for you.',
            'View All',
            '/properties'
            )}">
        </th:block>

        <section class="mt-10 grid md:grid-cols-3 gap-6">
            <th:block th:replace="~{fragments/property-card :: propertyCard}"></th:block>
            <th:block th:replace="~{fragments/property-card :: propertyCard}"></th:block>
            <th:block th:replace="~{fragments/property-card :: propertyCard}"></th:block>
        </section>
    </section>
</main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script src="/js/navbar.js"></script>
<script src="/js/search.js"></script>
</body>
</html>
