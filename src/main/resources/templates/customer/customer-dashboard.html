<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title th:text="${pageTitle}">Customer Dashboard</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

<header th:replace="~{fragments/navbar :: navbar('CUSTOMER', ${activeMenu})}"></header>

<aside th:replace="~{fragments/customer-sidebar :: customerSidebar(${activeMenu})}"></aside>


<main class="min-h-screen pt-24 lg:ml-64">

  <section class="mx-auto max-w-7xl px-6 py-8">

    <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">

      <div>
        <p class="mb-2 text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600">
          Customer Portal
        </p>

        <h1 class="text-3xl font-bold tracking-tight text-slate-950">
          Welcome back,
          <span th:text="${customerName}">Preethi</span>!
        </h1>

        <p class="mt-2 text-slate-600"
           th:text="${pageSubtitle}">
          Manage your properties and track their approval status.
        </p>
      </div>

      <div class="flex flex-col gap-3 sm:flex-row">

        <a th:href="@{/properties}"
           class="inline-flex items-center justify-center gap-2 rounded-xl
                          border border-slate-300 bg-white px-5 py-3
                          text-sm font-semibold text-slate-700 shadow-sm
                          transition hover:border-emerald-400 hover:text-emerald-700">

          <svg xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke-width="1.8"
               stroke="currentColor"
               class="h-5 w-5">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="m15.75 15.75 5.25 5.25m-9.75-3a6.75 6.75 0 1 1 0-13.5 6.75 6.75 0 0 1 0 13.5Z"/>
          </svg>

          Browse Properties
        </a>

        <a th:href="@{/customer/property/create}"
           class="inline-flex items-center justify-center gap-2 rounded-xl
                          bg-emerald-500 px-5 py-3 text-sm font-semibold
                          text-slate-950 shadow-sm transition
                          hover:bg-emerald-400">

          <svg xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke-width="1.8"
               stroke="currentColor"
               class="h-5 w-5">
            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 4.5v15m7.5-7.5h-15"/>
          </svg>

          Post Property
        </a>

      </div>

    </div>

    <!-- Dashboard Statistics -->
<!--    <div class="mt-8">-->
<!--      <th:block th:replace="~{fragments/empty-state ::-->
<!--        emptyState(-->
<!--            'No properties posted yet',-->
<!--            'Start by submitting your first property for admin approval.',-->
<!--            'Post Your First Property',-->
<!--            '/customer/property/create'-->
<!--        )}">-->
<!--      </th:block>-->
<!--    </div>-->

    <section class="mt-10">

      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 xl:grid-cols-4">

        <th:block th:replace="~{fragments/dashboard-stat-card ::
            dashboardStatCard(
                'Total Listings',
                ${totalListings},
                'Properties you have posted',
                'slate'
            )}">
        </th:block>

        <th:block th:replace="~{fragments/dashboard-stat-card ::
            dashboardStatCard(
                'Pending Approval',
                ${pendingListings},
                'Waiting for admin review',
                'amber'
            )}">
        </th:block>

        <th:block th:replace="~{fragments/dashboard-stat-card ::
            dashboardStatCard(
                'Approved',
                ${approvedListings},
                'Live on RealNest',
                'emerald'
            )}">
        </th:block>

        <th:block th:replace="~{fragments/dashboard-stat-card ::
            dashboardStatCard(
                'Rejected',
                ${rejectedListings},
                'Needs corrections',
                'rose'
            )}">
        </th:block>

      </div>

    </section>
    <!-- My Listings -->

    <section id="my-listings" class="mt-10">


        <div class="mb-6">
          <p class="text-sm font-semibold uppercase tracking-[0.2em] text-emerald-600">
            Property Management
          </p>

          <h2 class="mt-1 text-2xl font-bold text-slate-950">
            My Listings
          </h2>

          <p class="mt-1 text-sm text-slate-600">
            View and manage the properties you have submitted.
          </p>
        </div>

      <div class="grid grid-cols-1 gap-6 md:grid-cols-2 xl:grid-cols-3">

        <!-- Property Card 1 -->
        <th:block th:replace="~{fragments/property-card ::
          customerPropertyCard(
              'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80',
              'Modern villa',
              'Modern 3BHK Villa',
              'Whitefield, Bengaluru',
              'SALE',
              '₹1.25 Crore',
              'APPROVED',
              '#',
              '#',
              '#'
          )}">
        </th:block>
        <!-- Property Card 2 -->
        <th:block th:replace="~{fragments/property-card ::
          customerPropertyCard(
              'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80',
              'Modern villa',
              'Modern 3BHK Villa',
              'Whitefield, Bengaluru',
              'SALE',
              '₹1.25 Crore',
              'APPROVED',
              '#',
              '#',
              '#'
          )}">
        </th:block>
        <!-- Property Card 3 -->
        <th:block th:replace="~{fragments/property-card ::
          customerPropertyCard(
              'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=900&q=80',
              'Modern villa',
              'Modern 3BHK Villa',
              'Whitefield, Bengaluru',
              'SALE',
              '₹1.25 Crore',
              'APPROVED',
              '#',
              '#',
              '#'
          )}">
        </th:block>
      </div>

    </section>

  </section>

</main>
<script th:src="@{/js/navbar.js}"></script>
</body>
</html>
