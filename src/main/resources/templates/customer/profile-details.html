<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">Profile Details</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

<header th:replace="~{fragments/navbar :: navbar('CUSTOMER', ${activeMenu})}"></header>


<aside th:replace="~{fragments/customer-sidebar ::
        customerSidebar(${activeMenu})}">
</aside>

<main class="min-h-screen pt-24 lg:ml-64">

    <section class="mx-auto max-w-5xl px-6 py-8">

        <!-- Page Header -->
        <header class="mb-8">

            <p class="text-sm font-semibold uppercase
                      tracking-[0.2em] text-emerald-600">
                Customer Account
            </p>

            <h1 class="mt-2 text-3xl font-bold tracking-tight
                       text-slate-950"
                th:text="${pageTitle}">
                Profile Details
            </h1>

            <p class="mt-2 text-slate-600"
               th:text="${pageSubtitle}">
                Manage your personal and contact information.
            </p>

        </header>


        <section class="grid gap-6 lg:grid-cols-[320px_1fr]">

            <!-- Profile Summary -->
            <article class="rounded-3xl border border-slate-200
                            bg-white p-6 text-center shadow-sm">

                <div class="mx-auto flex h-24 w-24 items-center
                            justify-center rounded-full
                            bg-emerald-100 text-3xl font-bold
                            text-emerald-700">

                    <span th:text="${#strings.substring(customerName, 0, 1)}">
                        P
                    </span>

                </div>

                <h2 class="mt-5 text-xl font-bold text-slate-950"
                    th:text="${customerName}">
                    Preethi KJ
                </h2>

                <p class="mt-1 text-sm text-slate-500">
                    RealNest Customer
                </p>

                <div class="mt-6 border-t border-slate-100 pt-6">

                    <p class="text-xs font-semibold uppercase
                              tracking-[0.18em] text-slate-400">
                        Account Status
                    </p>

                    <span class="mt-3 inline-flex rounded-full
                                 bg-emerald-100 px-4 py-2
                                 text-sm font-semibold text-emerald-700">
                        Active
                    </span>

                </div>

            </article>


            <!-- Profile Form -->
            <article class="rounded-3xl border border-slate-200
                            bg-white p-6 shadow-sm">

                <header class="mb-6">

                    <p class="text-sm font-semibold uppercase
                              tracking-[0.2em] text-emerald-600">
                        Personal Information
                    </p>

                    <h2 class="mt-2 text-xl font-bold text-slate-950">
                        Your Details
                    </h2>

                    <p class="mt-1 text-sm text-slate-500">
                        Keep your contact information accurate and up to date.
                    </p>

                </header>

                <form th:action="@{/customer/profile/update}"
                      method="post"
                      class="space-y-6">

                    <div class="grid gap-6 md:grid-cols-2">

                        <div>
                            <label for="name"
                                   class="mb-2 block text-sm font-semibold
                                          text-slate-700">
                                Full Name
                            </label>

                            <input id="name"
                                   name="name"
                                   type="text"
                                   th:value="${customerName}"
                                   class="w-full rounded-2xl border
                                          border-slate-300 bg-white
                                          px-4 py-3 text-slate-900
                                          outline-none transition
                                          focus:border-emerald-500
                                          focus:ring-4
                                          focus:ring-emerald-500/10">
                        </div>

                        <div>
                            <label for="email"
                                   class="mb-2 block text-sm font-semibold
                                          text-slate-700">
                                Email Address
                            </label>

                            <input id="email"
                                   name="email"
                                   type="email"
                                   th:value="${customerEmail}"
                                   readonly
                                   class="w-full cursor-not-allowed
                                          rounded-2xl border
                                          border-slate-200 bg-slate-100
                                          px-4 py-3 text-slate-500">
                        </div>

                        <div>
                            <label for="phone"
                                   class="mb-2 block text-sm font-semibold
                                          text-slate-700">
                                Phone Number
                            </label>

                            <input id="phone"
                                   name="phone"
                                   type="tel"
                                   th:value="${customerPhone}"
                                   placeholder="Enter phone number"
                                   class="w-full rounded-2xl border
                                          border-slate-300 bg-white
                                          px-4 py-3 text-slate-900
                                          outline-none transition
                                          focus:border-emerald-500
                                          focus:ring-4
                                          focus:ring-emerald-500/10">
                        </div>

                        <div>
                            <label for="address"
                                   class="mb-2 block text-sm font-semibold
                                          text-slate-700">
                                Address
                            </label>

                            <input id="address"
                                   name="address"
                                   type="text"
                                   th:value="${customerAddress}"
                                   placeholder="Enter address"
                                   class="w-full rounded-2xl border
                                          border-slate-300 bg-white
                                          px-4 py-3 text-slate-900
                                          outline-none transition
                                          focus:border-emerald-500
                                          focus:ring-4
                                          focus:ring-emerald-500/10">
                        </div>

                    </div>


                    <div class="flex flex-col-reverse gap-4
                                border-t border-slate-100 pt-6
                                sm:flex-row sm:justify-between">

                        <th:block th:replace="~{fragments/buttons ::
                            outlineLink(
                                'Change Password',
                                '/auth/change-password'
                            )}">
                        </th:block>

                        <th:block th:replace="~{fragments/buttons ::
                            primaryButton(
                                'Save Changes',
                                'submit'
                            )}">
                        </th:block>

                    </div>

                </form>

            </article>

        </section>

    </section>

</main>

<script th:src="@{/js/navbar.js}"></script>

</body>
</html>
