<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register | RealNest</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 font-sans text-white">

<header th:replace="~{fragments/navbar :: navbar('PUBLIC', null)}">
</header>

<main class="relative flex min-h-screen items-center justify-center
             overflow-hidden px-6 pb-16 pt-32">

    <!-- Decorative background -->
    <div aria-hidden="true"
         class="pointer-events-none absolute inset-0 overflow-hidden">

        <div class="absolute -left-32 top-28 h-80 w-80 rounded-full
                    bg-emerald-500/10 blur-3xl">
        </div>

        <div class="absolute -right-32 bottom-12 h-96 w-96 rounded-full
                    bg-cyan-500/10 blur-3xl">
        </div>

    </div>

    <section class="relative w-full max-w-xl"
             aria-labelledby="registerTitle">

        <!-- Heading -->
        <header class="mb-8 text-center">

            <a th:href="@{/}"
               aria-label="Go to RealNest home"
               class="mb-5 inline-flex items-center justify-center
                      rounded-2xl border border-emerald-400/20
                      bg-emerald-400/10 p-3 text-emerald-400">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="h-7 w-7">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="M2.25 12 12 3l9.75 9
                             M4.5 9.75V21h15V9.75"/>

                </svg>

            </a>

            <p class="mb-3 text-xs font-semibold uppercase
                      tracking-[0.25em] text-emerald-400">
                Join RealNest
            </p>

            <h1 id="registerTitle"
                class="text-3xl font-bold tracking-tight text-white
                       sm:text-4xl">
                Create your account
            </h1>

            <p class="mt-3 text-sm leading-6 text-slate-400">
                Find your next home or list a property in just a few steps.
            </p>

        </header>

        <!-- Registration card -->
        <section class="rounded-3xl border border-white/10
                        bg-white/[0.06] p-6 shadow-2xl
                        shadow-black/20 backdrop-blur-xl sm:p-8">

            <!-- General backend error -->
            <div th:if="${errorMessage}"
                 role="alert"
                 class="mb-6 rounded-2xl border border-rose-400/20
                        bg-rose-400/10 px-4 py-3 text-sm
                        text-rose-300">

                <span th:text="${errorMessage}">
                    Unable to create your account.
                </span>

            </div>

            <form th:action="@{/auth/register}"
                  method="post"
                  class="space-y-5"
                  data-auth-form>

                <!-- Full name -->
                <div>

                    <label for="name"
                           class="mb-2 block text-sm font-medium
                                  text-slate-200">
                        Full name
                    </label>

                    <input id="name"
                           name="name"
                           type="text"
                           autocomplete="name"
                           required
                           autofocus
                           placeholder="Enter your full name"
                           class="w-full rounded-2xl border
                                  border-white/10 bg-slate-900/70
                                  px-4 py-3.5 text-sm text-white
                                  outline-none transition
                                  placeholder:text-slate-600
                                  focus:border-emerald-400
                                  focus:ring-4
                                  focus:ring-emerald-400/10">

                </div>

                <!-- Email -->
                <div>

                    <label for="email"
                           class="mb-2 block text-sm font-medium
                                  text-slate-200">
                        Email address
                    </label>

                    <input id="email"
                           name="email"
                           type="email"
                           autocomplete="email"
                           required
                           placeholder="you@example.com"
                           class="w-full rounded-2xl border
                                  border-white/10 bg-slate-900/70
                                  px-4 py-3.5 text-sm text-white
                                  outline-none transition
                                  placeholder:text-slate-600
                                  focus:border-emerald-400
                                  focus:ring-4
                                  focus:ring-emerald-400/10">
                </div>

                <!-- Phone number -->
                <div>

                    <label for="phoneNumber"
                           class="mb-2 block text-sm font-medium
                                  text-slate-200">
                        Phone number
                    </label>

                    <input id="phoneNumber"
                           name="phone"
                           type="tel"
                           inputmode="tel"
                           autocomplete="tel"
                           required
                           placeholder="Enter your phone number"
                           class="w-full rounded-2xl border
                                  border-white/10 bg-slate-900/70
                                  px-4 py-3.5 text-sm text-white
                                  outline-none transition
                                  placeholder:text-slate-600
                                  focus:border-emerald-400
                                  focus:ring-4
                                  focus:ring-emerald-400/10">

                </div>

                <!-- Password fields -->
                <div class="grid gap-5 sm:grid-cols-2">

                    <!-- Password -->
                    <div>

                        <label for="password"
                               class="mb-2 block text-sm font-medium
                                      text-slate-200">
                            Password
                        </label>

                        <div class="relative">

                            <input id="password"
                                   name="password"
                                   type="password"
                                   autocomplete="new-password"
                                   required
                                   minlength="8"
                                   placeholder="Minimum 8 characters"
                                   class="w-full rounded-2xl border
                                          border-white/10
                                          bg-slate-900/70
                                          py-3.5 pl-4 pr-12 text-sm
                                          text-white outline-none
                                          transition
                                          placeholder:text-slate-600
                                          focus:border-emerald-400
                                          focus:ring-4
                                          focus:ring-emerald-400/10">

                            <button type="button"
                                    data-password-toggle
                                    data-target="password"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                    class="absolute inset-y-0 right-0
                                           flex items-center px-4
                                           text-slate-500 transition
                                           hover:text-emerald-400">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke-width="1.8"
                                     stroke="currentColor"
                                     class="h-5 w-5"
                                     data-eye-open>

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M2.036 12.322a1.012 1.012
                                             0 0 1 0-.639C3.423 7.51
                                             7.36 4.5 12 4.5c4.638 0
                                             8.573 3.007 9.963 7.178
                                             .07.207.07.431 0 .639C20.577
                                             16.49 16.64 19.5 12 19.5
                                             c-4.638 0-8.573-3.007-9.963
                                             -7.178ZM15 12a3 3 0 1 1-6 0
                                             3 3 0 0 1 6 0Z"/>

                                </svg>

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke-width="1.8"
                                     stroke="currentColor"
                                     class="hidden h-5 w-5"
                                     data-eye-closed>

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M3.98 8.223A10.477 10.477
                                             0 0 0 1.934 12C3.226 16.338
                                             7.244 19.5 12 19.5c.993 0
                                             1.953-.138 2.863-.395
                                             M6.228 6.228A10.451 10.451
                                             0 0 1 12 4.5c4.756 0
                                             8.773 3.162 10.065 7.498
                                             a10.522 10.522 0 0 1-4.293
                                             5.774M6.228 6.228 3 3
                                             m3.228 3.228 3.65 3.65
                                             m7.894 7.894L21 21"/>

                                </svg>

                            </button>

                        </div>

                    </div>

                    <!-- Confirm password -->
                    <div>

                        <label for="confirmPassword"
                               class="mb-2 block text-sm font-medium
                                      text-slate-200">
                            Confirm password
                        </label>

                        <div class="relative">

                            <input id="confirmPassword"
                                   name="confirmPassword"
                                   type="password"
                                   autocomplete="new-password"
                                   required
                                   minlength="8"
                                   placeholder="Re-enter password"
                                   class="w-full rounded-2xl border
                                          border-white/10
                                          bg-slate-900/70
                                          py-3.5 pl-4 pr-12 text-sm
                                          text-white outline-none
                                          transition
                                          placeholder:text-slate-600
                                          focus:border-emerald-400
                                          focus:ring-4
                                          focus:ring-emerald-400/10">

                            <button type="button"
                                    data-password-toggle
                                    data-target="confirmPassword"
                                    aria-label="Show password"
                                    aria-pressed="false"
                                    class="absolute inset-y-0 right-0
                                           flex items-center px-4
                                           text-slate-500 transition
                                           hover:text-emerald-400">

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke-width="1.8"
                                     stroke="currentColor"
                                     class="h-5 w-5"
                                     data-eye-open>

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M2.036 12.322a1.012 1.012
                                             0 0 1 0-.639C3.423 7.51
                                             7.36 4.5 12 4.5c4.638 0
                                             8.573 3.007 9.963 7.178
                                             .07.207.07.431 0 .639C20.577
                                             16.49 16.64 19.5 12 19.5
                                             c-4.638 0-8.573-3.007-9.963
                                             -7.178ZM15 12a3 3 0 1 1-6 0
                                             3 3 0 0 1 6 0Z"/>

                                </svg>

                                <svg xmlns="http://www.w3.org/2000/svg"
                                     fill="none"
                                     viewBox="0 0 24 24"
                                     stroke-width="1.8"
                                     stroke="currentColor"
                                     class="hidden h-5 w-5"
                                     data-eye-closed>

                                    <path stroke-linecap="round"
                                          stroke-linejoin="round"
                                          d="M3.98 8.223A10.477 10.477
                                             0 0 0 1.934 12C3.226 16.338
                                             7.244 19.5 12 19.5c.993 0
                                             1.953-.138 2.863-.395
                                             M6.228 6.228A10.451 10.451
                                             0 0 1 12 4.5c4.756 0
                                             8.773 3.162 10.065 7.498
                                             a10.522 10.522 0 0 1-4.293
                                             5.774M6.228 6.228 3 3
                                             m3.228 3.228 3.65 3.65
                                             m7.894 7.894L21 21"/>

                                </svg>

                            </button>

                        </div>

                        <p id="passwordMismatchError"
                           class="mt-2 hidden text-xs text-rose-300">
                            Passwords do not match.
                        </p>

                    </div>

                </div>

                <!-- Submit -->
                <button type="submit"
                        data-loading-text="Creating account..."
                        class="flex w-full items-center justify-center
                               rounded-full bg-emerald-500 px-6 py-3.5
                               text-sm font-bold text-slate-950
                               transition hover:bg-emerald-400
                               focus:outline-none focus:ring-4
                               focus:ring-emerald-400/20
                               disabled:cursor-not-allowed
                               disabled:opacity-70">

                    <span data-button-text>Create account</span>

                    <svg xmlns="http://www.w3.org/2000/svg"
                         fill="none"
                         viewBox="0 0 24 24"
                         stroke-width="2"
                         stroke="currentColor"
                         class="ml-2 hidden h-4 w-4 animate-spin"
                         data-loading-icon>

                        <path stroke-linecap="round"
                              stroke-linejoin="round"
                              d="M12 3a9 9 0 1 0 9 9"/>

                    </svg>

                </button>

            </form>

            <p class="mt-7 text-center text-sm text-slate-400">

                Already have an account?

                <a th:href="@{/auth/login}"
                   class="ml-1 font-semibold text-emerald-400
                          transition hover:text-emerald-300">
                    Sign in
                </a>

            </p>

        </section>

    </section>

</main>

<script src="/js/navbar.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
