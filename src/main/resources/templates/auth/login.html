<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Login | RealNest</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 font-sans text-white">

<header th:replace="~{fragments/navbar :: navbar('PUBLIC', null)}">
</header>

<main class="relative flex min-h-[100svh] items-center
             justify-center overflow-hidden px-4 pb-5 pt-24
             sm:px-6">

  <!-- Decorative background -->
  <div aria-hidden="true"
       class="pointer-events-none absolute inset-0 overflow-hidden">

    <div class="absolute -left-32 top-28 h-80 w-80 rounded-full
                    bg-emerald-500/10 blur-3xl">
    </div>

    <div class="absolute -right-32 bottom-12 h-96 w-96 rounded-full
                    bg-cyan-500/10 blur-3xl">
    </div>

  </div>

  <section class="relative w-full max-w-md">

    <!-- Login card -->
    <section class="rounded-3xl border border-white/10
                        bg-white/[0.06] p-6 shadow-2xl
                        shadow-black/20 backdrop-blur-xl sm:p-8">

      <header class="mb-6 text-center">

        <h1 class="text-2xl font-bold tracking-tight text-white">
          Sign in
        </h1>

        <p class="mt-2 text-sm text-slate-400">
          Access your RealNest account.
        </p>

      </header>

      <div th:if="${param.error}"
           role="alert"
           class="mb-6 rounded-2xl border border-rose-400/20
                        bg-rose-400/10 px-4 py-3 text-sm
                        text-rose-300">

        Invalid email or password. Please try again.

      </div>

      <div th:if="${param.logout}"
           role="status"
           class="mb-6 rounded-2xl border border-emerald-400/20
                        bg-emerald-400/10 px-4 py-3 text-sm
                        text-emerald-300">

        You have been logged out successfully.

      </div>

      <div th:if="${successMessage}"
           role="status"
           class="mb-6 rounded-2xl border border-emerald-400/20
                        bg-emerald-400/10 px-4 py-3 text-sm
                        text-emerald-300">

                <span th:text="${successMessage}">
                    Registration successful. Please log in.
                </span>
      </div>

      <div th:if="${errorMessage}"
           role="alert"
           class="mb-6 rounded-2xl
            border border-rose-400/20
            bg-rose-400/10 px-4 py-3
            text-sm text-rose-300">

    <span th:text="${errorMessage}">
        Unable to send the password reset link.
    </span>

      </div>

      <form th:action="@{/auth/login}"
            method="post"
            class="space-y-5"
            data-auth-form>

        <!-- Email -->
        <div>

          <label for="email"
                 class="mb-2 block text-sm font-medium
                                  text-slate-200">
            Email address
          </label>

          <div class="relative">

                        <span class="pointer-events-none absolute inset-y-0
                                     left-0 flex items-center pl-4
                                     text-slate-500">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke-width="1.8"
                                 stroke="currentColor"
                                 class="h-5 w-5">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M21.75 6.75v10.5A2.25 2.25
                                         0 0 1 19.5 19.5h-15a2.25
                                         2.25 0 0 1-2.25-2.25V6.75
                                         M21.75 6.75A2.25 2.25 0 0 0
                                         19.5 4.5h-15a2.25 2.25 0 0 0
                                         -2.25 2.25m19.5 0-8.69
                                         5.516a2.25 2.25 0 0 1-2.12 0
                                         L2.25 6.75"/>

                            </svg>

                        </span>

            <input id="email"
                   name="username"
                   type="email"
                   autocomplete="email"
                   required
                   autofocus
                   placeholder="you@example.com"
                   class="w-full rounded-2xl border
                                      border-white/10 bg-slate-900/70
                                      py-3.5 pl-12 pr-4 text-sm
                                      text-white outline-none transition
                                      placeholder:text-slate-600
                                      focus:border-emerald-400
                                      focus:ring-4
                                      focus:ring-emerald-400/10">

          </div>

        </div>

        <!-- Password -->
        <div>

          <div class="mb-2 flex items-center justify-between">

            <label for="password"
                   class="text-sm font-medium text-slate-200">
              Password
            </label>

            <button type="button"
                    id="openForgotPasswordModal"
                    class="text-xs font-semibold
               text-emerald-400 transition
               hover:text-emerald-300">
              Forgot password?
            </button>

          </div>

          <div class="relative">

                        <span class="pointer-events-none absolute inset-y-0
                                     left-0 flex items-center pl-4
                                     text-slate-500">

                            <svg xmlns="http://www.w3.org/2000/svg"
                                 fill="none"
                                 viewBox="0 0 24 24"
                                 stroke-width="1.8"
                                 stroke="currentColor"
                                 class="h-5 w-5">

                                <path stroke-linecap="round"
                                      stroke-linejoin="round"
                                      d="M16.5 10.5V6.75a4.5 4.5
                                         0 0 0-9 0v3.75m-.75 0h10.5
                                         A2.25 2.25 0 0 1 19.5 12.75
                                         v6A2.25 2.25 0 0 1 17.25 21
                                         H6.75A2.25 2.25 0 0 1 4.5
                                         18.75v-6a2.25 2.25 0 0 1
                                         2.25-2.25Z"/>

                            </svg>

                        </span>

            <input id="password"
                   name="password"
                   type="password"
                   autocomplete="current-password"
                   required
                   placeholder="Enter your password"
                   class="w-full rounded-2xl border
                                      border-white/10 bg-slate-900/70
                                      py-3.5 pl-12 pr-12 text-sm
                                      text-white outline-none transition
                                      placeholder:text-slate-600
                                      focus:border-emerald-400
                                      focus:ring-4
                                      focus:ring-emerald-400/10">

            <button type="button"
                    data-password-toggle
                    data-target="password"
                    aria-label="Show password"
                    aria-pressed="false"
                    class="absolute inset-y-0 right-0
                                       flex items-center px-4
                                       text-slate-500 transition
                                       hover:text-emerald-400">

              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke-width="1.8"
                   stroke="currentColor"
                   class="h-5 w-5"
                   data-eye-open>

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.036 12.322a1.012 1.012
                                         0 0 1 0-.639C3.423 7.51
                                         7.36 4.5 12 4.5c4.638 0
                                         8.573 3.007 9.963 7.178
                                         .07.207.07.431 0 .639C20.577
                                         16.49 16.64 19.5 12 19.5
                                         c-4.638 0-8.573-3.007-9.963
                                         -7.178ZM15 12a3 3 0 1 1-6 0
                                         3 3 0 0 1 6 0Z"/>

              </svg>

              <svg xmlns="http://www.w3.org/2000/svg"
                   fill="none"
                   viewBox="0 0 24 24"
                   stroke-width="1.8"
                   stroke="currentColor"
                   class="hidden h-5 w-5"
                   data-eye-closed>

                <path stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M3.98 8.223A10.477 10.477
                                         0 0 0 1.934 12C3.226 16.338
                                         7.244 19.5 12 19.5c.993 0
                                         1.953-.138 2.863-.395
                                         M6.228 6.228A10.451 10.451
                                         0 0 1 12 4.5c4.756 0
                                         8.773 3.162 10.065 7.498
                                         a10.522 10.522 0 0 1-4.293
                                         5.774M6.228 6.228 3 3
                                         m3.228 3.228 3.65 3.65
                                         m7.894 7.894L21 21
                                         m-3.228-3.228-3.65-3.65
                                         m0 0a3 3 0 1 0-4.243-4.243"/>

              </svg>

            </button>

          </div>

        </div>

        <!-- Remember me -->
        <label class="flex w-fit cursor-pointer items-center gap-3
                              text-sm text-slate-400">

          <input id="rememberMe"
                 type="checkbox"
                 name="remember-me"
                 class="h-4 w-4 rounded border-white/20
                                  bg-slate-900 text-emerald-500
                                  accent-emerald-500">

          <span>Keep me signed in</span>

        </label>

        <!-- Submit -->
        <button type="submit"
                data-loading-text="Signing in..."
                class="flex w-full items-center justify-center
                               rounded-full bg-emerald-500 px-6 py-3.5
                               text-sm font-bold text-slate-950
                               transition hover:bg-emerald-400
                               focus:outline-none focus:ring-4
                               focus:ring-emerald-400/20
                               disabled:cursor-not-allowed
                               disabled:opacity-70">

          <span data-button-text>Sign in</span>

          <svg xmlns="http://www.w3.org/2000/svg"
               fill="none"
               viewBox="0 0 24 24"
               stroke-width="2"
               stroke="currentColor"
               class="ml-2 hidden h-4 w-4 animate-spin"
               data-loading-icon>

            <path stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 3a9 9 0 1 0 9 9"/>

          </svg>

        </button>

      </form>

      <p class="mt-7 text-center text-sm text-slate-400">

        Don’t have an account?

        <a th:href="@{/auth/register}"
           class="ml-1 font-semibold text-emerald-400
                          transition hover:text-emerald-300">
          Create an account
        </a>

      </p>

    </section>

  </section>

</main>
<th:block th:replace="~{fragments/forgot-password-modal
                        :: forgotPasswordModal}">
</th:block>

<script src="/js/navbar.js"></script>
<script src="/js/auth.js"></script>

</body>
</html>
