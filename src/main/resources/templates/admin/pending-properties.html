<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">
        Pending Approvals
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

<header th:replace="~{fragments/navbar :: navbar('ADMIN', ${activeMenu})}">
</header>

<aside th:replace="~{fragments/admin-sidebar ::
        adminSidebar(${activeMenu})}">
</aside>

<main class="min-h-screen pt-24 lg:ml-64">

    <section class="mx-auto max-w-7xl px-6 py-8">

        <!-- Page Heading -->
        <header class="flex flex-col gap-4
                       sm:flex-row sm:items-end sm:justify-between">

            <div>

                <p class="mb-2 text-sm font-semibold uppercase
                          tracking-[0.2em] text-emerald-600">
                    Property Management
                </p>

                <h1 class="text-3xl font-bold tracking-tight text-slate-950">
                    Pending Approvals
                </h1>

                <p class="mt-2 text-slate-600"
                   th:text="${pageSubtitle}">
                    Review properties submitted by customers.
                </p>

            </div>

            <div class="inline-flex w-fit items-center gap-2
                        rounded-xl border border-amber-200
                        bg-amber-50 px-4 py-3">

                <span class="h-2.5 w-2.5 rounded-full bg-amber-500"></span>

                <span class="text-sm font-semibold text-amber-700">

                    <span th:text="${pendingPropertyCount}">
                        6
                    </span>

                    properties waiting

                </span>

            </div>

        </header>
        <!-- Pending Property Cards -->
        <section class="mt-10">

            <div class="mb-5">

                <h2 class="text-xl font-bold text-slate-950">
                    Submitted Properties
                </h2>

                <p class="mt-1 text-sm text-slate-600">
                    Select Review to inspect and take action on a property.
                </p>

            </div>

            <div th:if="${!#lists.isEmpty(pendingProperties)}"
                 class="space-y-4">

                <th:block th:each="property : ${pendingProperties}">

                    <th:block th:replace="~{fragments/property-card ::
                            adminPropertyCard(
                                ${#lists.isEmpty(property.images)
                                    ? '/images/property-placeholder.png'
                                    : property.images[0].imageUrl},
                                ${property.title},
                                ${property.title},
                                ${property.city + ', ' + property.state},
                                ${property.listingType},
                                ${'₹' + #numbers.formatDecimal(
                                    property.price,
                                    1,
                                    'COMMA',
                                    0,
                                    'POINT'
                                )},
                                ${property.status},
                                ${property.ownerName},
                                ${#temporals.format(
                                    property.createdAt,
                                    'dd MMMM yyyy'
                                )},
                                ${'/admin/properties/' + property.id + '/review'},
                                ${'/admin/properties/' + property.id + '/review'}
                            )}">
                    </th:block>

                </th:block>

            </div>
        </section>

<!--        Empty Card-->
        <div th:if="${#lists.isEmpty(pendingProperties)}"
             class="rounded-2xl border border-dashed border-slate-300
            bg-white px-6 py-14 text-center">

            <div class="mx-auto flex h-14 w-14 items-center justify-center
                rounded-full bg-emerald-50 text-emerald-600">

                <svg xmlns="http://www.w3.org/2000/svg"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke-width="1.8"
                     stroke="currentColor"
                     class="h-7 w-7">

                    <path stroke-linecap="round"
                          stroke-linejoin="round"
                          d="m4.5 12.75 6 6 9-13.5"/>
                </svg>

            </div>

            <h3 class="mt-4 text-lg font-bold text-slate-950">
                All caught up!
            </h3>

            <p class="mt-2 text-sm text-slate-500">
                There are no properties waiting for approval.
            </p>

        </div>

    </section>

</main>

<script th:src="@{/js/navbar.js}"></script>

</body>
</html>
