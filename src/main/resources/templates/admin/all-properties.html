<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle}">
        All Approvals
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="min-h-screen bg-slate-100 text-slate-900">

    <header th:replace="~{fragments/navbar :: navbar('ADMIN', ${activeMenu})}">
    </header>

<aside th:replace="~{fragments/admin-sidebar ::
            adminSidebar(${activeMenu})}">
    </aside>

    <main class="min-h-screen pt-24 lg:ml-64">

    <section class="mx-auto max-w-7xl px-6 py-8">

        <!-- Page Heading -->
        <header>

            <p class="mb-2 text-sm font-semibold uppercase
              tracking-[0.2em] text-emerald-600">
                Property Management
            </p>

            <h1 class="text-3xl font-bold tracking-tight text-slate-950">
                All Properties
            </h1>

            <p class="mt-2 text-slate-600"
               th:text="${pageSubtitle}">
                View every property submitted to RealNest.
            </p>

        </header>
        <!-- Pending Property Cards -->
        <section class="mt-10">

            <div class="mb-5">

                <h2 class="text-xl font-bold text-slate-950">
                    Property Listings
                </h2>

                <p class="mt-1 text-sm text-slate-600">
                    View pending, approved and rejected property submissions.
                </p>

            </div>

            <div th:if="${!#lists.isEmpty(properties)}"
                 class="space-y-4">

                <th:block th:each="property : ${properties}">

                    <th:block th:replace="~{fragments/property-card ::
                            adminPropertyCard(
                                ${#lists.isEmpty(property.images)
                                    ? '/images/property-placeholder.png'
                                    : property.images[0].imageUrl},
                                ${property.title},
                                ${property.title},
                                ${property.city + ', ' + property.state},
                                ${property.listingType},
                                ${'₹' + #numbers.formatDecimal(
                                    property.price,
                                    1,
                                    'COMMA',
                                    0,
                                    'POINT'
                                )},
                                ${property.status},
                                ${property.ownerName},
                                ${#temporals.format(
                                    property.createdAt,
                                    'dd MMMM yyyy'
                                )},
                                ${'/admin/properties/' + property.id},
                                ${'/admin/properties/' + property.id + '/review'}
                            )}">
                    </th:block>
                </th:block>

            </div>

<!--            Empty Card-->
            <div th:if="${#lists.isEmpty(properties)}"
                 class="rounded-2xl border border-dashed border-slate-300
            bg-white px-6 py-14 text-center">

                <h3 class="text-lg font-bold text-slate-950">
                    No properties available
                </h3>

                <p class="mt-2 text-sm text-slate-500">
                    Property submissions will appear here.
                </p>

            </div>
        </section>

    </section>

</main>

<script th:src="@{/js/navbar.js}"></script>

</body>
</html>
